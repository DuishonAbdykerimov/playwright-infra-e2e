version: '3.8'

services:
  # 1. Слой Базы Данных (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: qa_postgres
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password123
      POSTGRES_DB: ecom_test_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - infra_e2e_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d ecom_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Слой Кэша и Сессий (Redis)
  redis_cache:
    image: redis:7-alpine
    container_name: qa_redis
    ports:
      - "6379:6379"
    networks:
      - infra_e2e_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Слой Брокера Сообщений (RabbitMQ)
  rabbitmq_broker:
    image: rabbitmq:3-management-alpine
    container_name: qa_rabbitmq
    ports:
      - "5672:5672"   # Порт для пересылки сообщений кодом
      - "15672:15672" # Порт для красивой веб-панели управления
      - "15692:15692" # Порт для сбора метрик Prometheus
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - infra_e2e_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 4. Тестовое окружение Playwright JS
  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CI: ${CI:-}
      ECOM_USER_EMAIL: ${ECOM_USER_EMAIL:-}
      ECOM_USER_PASSWORD: ${ECOM_USER_PASSWORD:-}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password123
      POSTGRES_DB: ecom_test_db
      K8S_POSTGRES_SKIP: "true"
      REDIS_URL: redis://redis_cache:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq_broker:5672
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq_broker:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
      - ./test-data:/app/test-data
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./allure-results:/app/allure-results
    networks:
      - infra_e2e_network

  # 5. Сбор метрик (Prometheus)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: qa_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - infra_e2e_network
    deploy:
      resources:
        limits:
          memory: 256M

  # 6. Визуализация метрик (Grafana)
  grafana:
    image: grafana/grafana-oss:10.0.0
    container_name: qa_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - infra_e2e_network
    deploy:
      resources:
        limits:
          memory: 512M

  # 7. База логов (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: qa_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    networks:
      - infra_e2e_network
    deploy:
      resources:
        limits:
          memory: 512M

  # 8. Визуализация логов (Kibana)
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: qa_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - infra_e2e_network
    deploy:
      resources:
        limits:
          memory: 512M

  # 9. Диспетчер автоматизации (n8n)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_infra_e2e
    ports:
      - "5678:5678"
    environment:
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-https://duishon-n8n.loca.lt/}
      GENERIC_TIMEZONE: Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - infra_e2e_network
    restart: always

volumes:
  n8n_data:
  pgdata:

networks:
  infra_e2e_network:
    driver: bridge
