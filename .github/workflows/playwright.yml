name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECOM_USER_EMAIL: ${{ secrets.ECOM_USER_EMAIL }}
      ECOM_USER_PASSWORD: ${{ secrets.ECOM_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests in Docker
        run: docker compose --profile test run --build --rm e2e

      # --- 🔥 ВОТ ОН, НАШ ИИ-КОНВЕЙЕР САМОИСЦЕЛЕНИЯ ---
      - name: Send Failure Webhook to n8n AI Engine
        if: failure() # Сработает ТОЛЬКО если тесты внутри докера упали!
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "::error::GitHub Actions secret N8N_WEBHOOK_URL is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-delay 2 \
            -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "failed",
              "test_name": "Playwright E2E Client Dashboard Run",
              "error": "Автотест упал в Docker-окружении GitHub Actions. ИИ-конвейер собирает логи для дебага.",
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            allure-results/
          retention-days: 30

      - name: Stop test infrastructure
        if: ${{ always() }}
        run: docker compose down --volumes
