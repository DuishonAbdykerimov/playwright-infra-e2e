name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ECOM_USER_EMAIL: ${{ secrets.ECOM_USER_EMAIL }}
      ECOM_USER_PASSWORD: ${{ secrets.ECOM_USER_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate optional synthetic boundary fixture
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/ai/database-disrupter.js

      - name: Build and run tests in Docker
        id: e2e
        shell: bash
        run: |
          set +e
          docker compose --profile test run --build --rm e2e 2>&1 | tee e2e-test.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ "$test_status" -ne 0 ]] && ! git diff --quiet -- tests/; then
            echo "AI changed test files; rerunning the full Playwright suite."
            set +e
            docker compose --profile test run --rm e2e 2>&1 | tee -a e2e-test.log
            retry_status=${PIPESTATUS[0]}
            set -e

            if [[ "$retry_status" -eq 0 ]]; then
              test_status=0
              echo "ai_fix_validated=true" >> "$GITHUB_OUTPUT"
            else
              test_status=$retry_status
            fi
          fi

          failure_summary="$(grep -E 'Error:|Expected:|Received:|SyntaxError:|[0-9]+ failed|tests/[^[:space:]]+\.spec\.js' e2e-test.log | tail -n 20 || true)"
          if [[ -z "$failure_summary" ]]; then
            failure_summary="Docker test command failed; see the e2e-test.log artifact."
          fi

          delimiter="FAILURE_SUMMARY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'failure_summary<<%s\n' "$delimiter"
            printf '%s\n' "$failure_summary"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

          exit "$test_status"

      - name: Open pull request for validated AI repairs
        if: ${{ steps.e2e.outputs.ai_fix_validated == 'true' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain tests/)" ]]; then
            echo "No AI-generated test changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="ai-self-healing/${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add tests/
          git commit -m "chore(ai-healing): propose validated Playwright test repair"
          git push origin "$branch"

          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(ai-healing): validated Playwright test repair" \
            --body "AI generated a test repair after a Playwright failure. The full Playwright suite passed on the repaired working tree. Please review the diff before merging."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e-test.log
            playwright-report/
            test-results/
            test-data/disruption-fixtures.json
            allure-results/
            tests/database-disruption.spec.js
          retention-days: 30

      - name: Stop test infrastructure
        if: ${{ always() }}
        run: docker compose down --volumes
